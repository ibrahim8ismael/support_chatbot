# Production compose — run from the repository root on the host:
#
#   docker compose --env-file .env -f docker/docker-compose.prod.yml up -d --build
#
# Per-host values live in the repo-root .env (gitignored — template:
# docker/.env.prod.example). DATABASE_URL/REDIS_URL in that file must use the
# service names (postgres, redis). Runtime images are pinned by digest
# (security.md § Dependencies); bump them monthly with `docker pull <image>`
# and update the sha here.
#
# `migrate` is a one-shot of the same api image: it applies the forward-only
# Drizzle migrations, and `api` starts only after it exits 0 (depends_on).
# Caddy is the only published entry point: TLS in front of web + api.

name: support-agent

x-api: &api
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  image: support-agent-api
  env_file:
    - ../.env
  environment:
    NODE_ENV: production

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-support_agent}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot schema migration (deploy step 3 in docs/operations/deployment.md).
  # No restart: a failure fails the deploy, and the logs say why.
  migrate:
    <<: *api
    command: ['node', 'dist/cli/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* is baked at build time — the public dashboard origin
        # (rebuild web after changing it).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # The only published ports in the stack: TLS entry point (docs/operations/deployment.md).
  proxy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
