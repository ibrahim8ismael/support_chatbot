# Production Compose for Support Agent AI (Behind Host Nginx)
# Automatically deployed via GitHub Actions CI/CD with immutable image tags.

name: support-agent

x-api: &api
  image: ${API_IMAGE:-ghcr.io/ibrahim8ismael/support_chatbot/api:${IMAGE_TAG:-latest}}
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file:
    - .env
  environment:
    NODE_ENV: ${NODE_ENV:-development}

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the repo-root .env}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sa} -d ${POSTGRES_DB:-support_agent}']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in the repo-root .env}',
        '--appendonly',
        'yes',
        '--maxmemory',
        '512mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in the repo-root .env}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *api
    command: ['node', 'dist/cli/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    ports:
      - '127.0.0.1:3201:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-ghcr.io/ibrahim8ismael/support_chatbot/web:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://support-agent.imtelak.com}
    ports:
      - '127.0.0.1:3200:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
