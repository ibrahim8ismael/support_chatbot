name: Deploy to Production

# ─── Triggers ────────────────────────────────────────────────────────────────
# Fires only after the existing "CI" workflow completes successfully on main.
# This avoids duplicating the quality gate that ci.yml already runs.
on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]
  # Allow manual re-deploy from the GitHub Actions UI (e.g. after fixing secrets)
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA to deploy (leave blank → latest main)'
        required: false
        default: ''

# ─── Concurrency ─────────────────────────────────────────────────────────────
concurrency:
  group: production-deployment
  cancel-in-progress: false # Never cancel an in-flight deploy; queue instead

# ─── Minimum required permissions ────────────────────────────────────────────
permissions:
  contents: read
  packages: write # push to GHCR

# ─── Shared env ──────────────────────────────────────────────────────────────
env:
  REGISTRY: ghcr.io
  REPO_LOWER: ibrahim8ismael/support_chatbot

jobs:
  # ============================================================================
  # Guard: skip if the upstream CI run failed
  # ============================================================================
  guard:
    name: Verify CI passed
    runs-on: ubuntu-latest
    # For workflow_run events, only proceed when CI succeeded.
    # For workflow_dispatch the condition is always true.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI status OK
        run: echo "Upstream CI passed — proceeding with deployment."

  # ============================================================================
  # Stage 1 — Build & publish immutable Docker images
  # ============================================================================
  build-and-publish:
    name: Build & Publish Container Images
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.resolve_sha.outputs.sha }}
    steps:
      - name: Resolve target commit SHA
        id: resolve_sha
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "sha=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_sha.outputs.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/api:${{ steps.resolve_sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://support-agent.imtelak.com
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/web:${{ steps.resolve_sha.outputs.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO_LOWER }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2 — SSH deploy to production server
  # ============================================================================
  deploy-to-production:
    name: Deploy to Production Host
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Execute server deployment via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST || '135.181.204.97' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          # Use a PAT (GHCR_TOKEN secret) for server-side image pull.
          # The GITHUB_TOKEN is ephemeral and scoped to this runner only —
          # the production server needs its own long-lived pull credential.
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write trusted host key (MITM protection)
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${SERVER_PORT}" -H "${SERVER_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

          # Load the deploy private key
          eval "$(ssh-agent -s)"
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

          # Send all deployment variables via env in the SSH command.
          # Variables are passed as inline exports before the script path to
          # avoid shell quoting issues with special characters in tokens.
          ssh -p "${SERVER_PORT}" \
              -o BatchMode=yes \
              -o ConnectTimeout=30 \
              "${SERVER_USER}@${SERVER_HOST}" \
              "export IMAGE_TAG='${IMAGE_TAG}'; \
               export GHCR_USER='${GHCR_USER}'; \
               export GHCR_TOKEN='${GHCR_TOKEN}'; \
               export REGISTRY='ghcr.io'; \
               /root/support-agent/scripts/deploy.sh"
