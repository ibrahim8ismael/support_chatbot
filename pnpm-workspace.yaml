packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency lifecycle scripts by default — allow the ones our
# toolchain needs (esbuild/tsx/drizzle-kit, watchers, BullMQ native bits).
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - msgpackr-extract
  - unrs-resolver
